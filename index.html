<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLife - 绿色生活</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              leaf: {
                50: '#f2fcf5',
                100: '#e1f8e8',
                200: '#c3eed2',
                300: '#95e0b3',
                400: '#5cc98d',
                500: '#34af6d',
                600: '#258e57',
                700: '#207147',
                800: '#1d5a3b',
                900: '#194a32',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #f2fcf5;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Simple Fade In Animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      /* Error UI */
      #error-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        text-align: center;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div id="error-overlay">
        <h2 style="color: #e11d48; margin-bottom: 10px; font-weight: bold;">⚠️ 启动失败</h2>
        <p style="color: #4b5563;" id="error-message">应用加载遇到问题，请检查网络或控制台。</p>
        <button onclick="window.location.reload()" style="margin-top: 15px; padding: 8px 16px; background-color: #e11d48; color: white; border: none; border-radius: 8px; cursor: pointer;">
          重试
        </button>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
